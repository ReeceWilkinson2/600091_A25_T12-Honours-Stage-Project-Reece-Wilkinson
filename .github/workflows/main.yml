name: HonoursRun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore Honours_Project_CompetencyandSkillTracking.sln

      - name: Build
        run: dotnet build Honours_Project_CompetencyandSkillTracking.sln -c Debug --no-restore

      - name: Test
        run: dotnet test Honours_Project_CompetencyandSkillTracking.sln -c Debug --no-build
