name: HonoursRun

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Clean
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Directory |
            Where-Object { $_.Name -in 'bin','obj' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore
        run: dotnet restore Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln

      - name: Test
        run: dotnet test HonoursUnitTests/HonoursUnitTests.csproj -c Debug --no-build
