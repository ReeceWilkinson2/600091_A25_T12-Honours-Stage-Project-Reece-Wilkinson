name: HonoursRun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore 600091_A25_T12-Honours-Stage-Project-Reece-Wilkinson/Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln

      - name: Build
        run: dotnet build 600091_A25_T12-Honours-Stage-Project-Reece-Wilkinson/Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln -c Debug --no-restore

      - name: Test
        run: dotnet test 600091_A25_T12-Honours-Stage-Project-Reece-Wilkinson/Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln -c Debug --no-build
