name: HonoursRun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln

      - name: Build Web Project
        run: dotnet build Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.csproj -c Debug --no-restore

      - name: Build Tests
        run: dotnet build HonoursUnitTests/HonoursUnitTests.csproj -c Debug --no-restore

      - name: Run Tests
        run: dotnet test HonoursUnitTests/HonoursUnitTests.csproj -c Debug --no-build
