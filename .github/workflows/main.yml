name: HonoursRun
on: 
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Restore
        working-directory: ./HonoursUnitTests
        run: dotnet restore
  
      - name: Build
        working-directory: ./HonoursUnitTests
        run: dotnet build
  
      - name: Test
        working-directory: ./HonoursUnitTests
        run: dotnet test --no-build
