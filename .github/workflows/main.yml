name: HonoursRun

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Hard clean
        run: |
          rmdir /s /q Honours_Project_CompetencyandSkillTracking\**\bin || exit 0
          rmdir /s /q Honours_Project_CompetencyandSkillTracking\**\obj || exit 0
        
      - name: Restore
        run: dotnet restore Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln

      - name: Build Solution
        run: dotnet build Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln -c Debug

      - name: Test
        run: dotnet test Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln -c Debug
