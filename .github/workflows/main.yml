name: HonoursRun

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Clean
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Include bin,obj |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore
        run: dotnet restore Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln

      - name: Build
        run: dotnet build HonoursUnitTests/HonoursUnitTests.csproj -c Debug

      - name: Test
        run: dotnet test HonoursUnitTests/HonoursUnitTests.csproj -c Debug
