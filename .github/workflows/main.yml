name: HonoursRun
on: 
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v2
      - name: Checkout Repo
        run: powershell Copy-Item -Path C:\Users\actions-runner\* -Destination C:\inetpub\wwwroot -force

  
      - name: Install Test Platform
        working-directory:
        run: dotnet add package Microsoft.TestPlatform --version 17.5.0
  
      - name: Restore
        working-directory:
        run: dotnet restore
  
      - name: Build
        working-directory:
        run: dotnet build
  
      - name: Test
        working-directory:
        run: dotnet test MyBlazorTests.csproj
