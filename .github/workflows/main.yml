name: HonoursRun

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean bin and obj
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Directory |
            Where-Object { $_.Name -in 'bin','obj' } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Restore dependencies
        run: dotnet restore Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.sln

      - name: Build main project
        run: dotnet build Honours_Project_CompetencyandSkillTracking/Honours_Project_CompetencyandSkillTracking.csproj -c Debug

      - name: Build test project
        run: dotnet build HonoursUnitTests/HonoursUnitTests.csproj -c Debug

      - name: Run tests
        run: dotnet test HonoursUnitTests/HonoursUnitTests.csproj -c Debug
