name: HonoursRun
on: 
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v2
      - name: Checkout Repo
        run: powershell Copy-Item -Path C:\Users\actions-runner\* -Destination C:\inetpub\wwwroot -force
        
      - name: Restore
        working-directory: ./HonoursUnitTests
        run: dotnet restore
  
      - name: Build
        working-directory: ./HonoursUnitTests
        run: dotnet build
  
      - name: Test
        working-directory: ./HonoursUnitTests
        run: dotnet test --no-build
